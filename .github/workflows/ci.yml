name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    needs: fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      - run: cargo clippy --all-targets --locked -- -D warnings

  # M7 preve um fixture de referencia preta baixado e conferido por sha256 antes
  # da suite. Ele NAO esta aqui porque nem o script nem o teste existem: o repo
  # foi semeado com `fn main() {}` e nenhum `src/` ou `tests/` le
  # VYNAMP_MP3_REFERENCE. O template prescrevia `./scripts/fetch-fixtures.sh`,
  # um arquivo que nunca foi criado em nenhum dos tres apps -- o job falhava com
  # exit 127 antes de rodar um teste sequer.
  #
  # Quando o primeiro teste de referencia preta entrar, ele vem com o script e
  # com o `#[ignore = "VYNAMP_MP3_REFERENCE ausente"]`, e este job ganha de volta
  # o passo de fetch e o `-- --include-ignored`. Enquanto nao existir teste que
  # consuma o fixture, baixar oito megabytes por run serve a nada.
  test:
    needs: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      - run: cargo test --all --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --all --locked --target ${{ matrix.target }}

  gate:
    name: CI Gate
    if: always()
    needs: [fmt, clippy, test, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Aggregate
        shell: bash
        run: |
          test "${{ needs.fmt.result }}" = success
          test "${{ needs.clippy.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.build.result }}" = success
          echo 'CI Gate passed.'
